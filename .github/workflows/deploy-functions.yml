# Publicar las edge functions desde GitHub, no desde la Mac de Sebastián.
#
# POR QUÉ (2026-08-23): el sitio ya se publica solo desde `main` (deploy.yml),
# pero las functions de Supabase no. Cada cambio en una function dependía de que
# alguien abriera una terminal con el CLI logueado y corriera el deploy a mano.
# Consecuencia real de esta misma tanda: el email de bienvenida quedó escrito,
# revisado y mergeado, y no salía — porque el código estaba en el repo y no en
# Supabase. Lo mismo que pasaba con el blog antes de deploy.yml: "publicado" y
# roto al mismo tiempo.
#
# QUÉ DEPLOYA: SOLO las functions listadas abajo, y solo cuando cambia su
# carpeta. NO deploya las ~60 functions del repo de una: la copia del repo y la
# que está corriendo en Supabase pueden haberse separado con el tiempo, y un
# deploy masivo cambiaría comportamiento de cosas que nadie tocó. Agregar una
# function acá es una decisión explícita, no un efecto secundario.
#
# Necesita UN secret en el repo (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — token personal de https://supabase.com/dashboard/account/tokens
# El project-ref no es secreto (identifica, no autoriza) y ya está en el repo.

name: Publicar edge functions

on:
  push:
    branches: [main]
    paths:
      # TODAS las functions, no dos. Antes vigilaba solo newsletter-welcome y
      # resend-events: tocar cualquiera de las otras 60 dejaba el código en el
      # repo y Supabase corriendo la versión vieja, sin avisar.
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  # para re-deployar sin tener que commitear (pestaña Actions → Run workflow)
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false   # a diferencia del sitio, acá cancelar a la mitad deja una function vieja

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lumoevaotokgqnpybkyf
    steps:
      - uses: actions/checkout@v4

      # Falla fuerte y explica, en vez de "no encontró el token" tres pasos
      # después. Si esto se pone rojo, la causa está en el mensaje.
      - name: Comprobar que el token está
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN."
            echo "Crealo en https://supabase.com/dashboard/account/tokens y pegalo en"
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Sin eso las functions NO se publican: el código queda en el repo y"
            echo "Supabase sigue corriendo la versión vieja."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Se publican TODAS, y el permiso de cada una sale de supabase/config.toml,
      # no de un flag en la línea de comandos.
      #
      # ESTO ES DELIBERADO Y NO SE SIMPLIFICA: 61 de las 62 functions van con
      # verify_jwt=false porque las llaman terceros sin sesión (webhooks de
      # Resend, el cron con su secreto, el sitio público). La excepción es
      # admin-users, que da de alta y baja usuarios del dashboard y SÍ exige
      # sesión. Si acá volviera un --no-verify-jwt global, ese deploy dejaría
      # admin-users abierta a cualquiera con la clave publishable, que está a la
      # vista en el JS del sitio.
      - name: Publicar todas las functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      # Regresión que importa más que el deploy en sí: comprobar que admin-users
      # sigue exigiendo sesión después de publicar. Si algún día alguien mete un
      # flag global, esto se pone rojo antes de que alguien lo descubra por las
      # malas.
      - name: admin-users sigue cerrada
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 -X POST \
            -H 'Content-Type: application/json' -d '{"action":"list"}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/admin-users")
          echo "admin-users sin sesión responde: $code"
          [ "$code" = "401" ] || { echo "::error::admin-users quedó ABIERTA (esperaba 401, dio $code)"; exit 1; }

      # Verificar, no suponer: que la function conteste de verdad. Sin body,
      # newsletter-welcome responde 400 "email inválido" — con eso alcanza para
      # saber que está viva y ejecutando ESTE código. Un 404 significa que el
      # deploy no llegó, aunque el paso anterior diga OK.
      - name: Comprobar que responde
        run: |
          sleep 5
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -m 25 -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/newsletter-welcome")
          echo "$code  $(head -c 200 /tmp/r.txt)"
          [ "$code" = "400" ] || { echo "::error::newsletter-welcome no respondió como se esperaba (400 sin body)"; exit 1; }
