# Publicar viven.ch desde GitHub, no desde la Mac de Sebastián.
#
# POR QUÉ (2026-08-14): hasta hoy el sitio se publicaba a mano con
# `npx wrangler deploy` desde una carpeta local. Eso tenía dos consecuencias que
# se veían recién cuando dolían:
#   1. El motor de blog (edge function publish-blog) commitea los posts nuevos
#      directo a GitHub y los marca publicados — pero hasta que alguien no
#      compilaba y desplegaba a mano, la página daba 404. Tres posts estuvieron
#      así, "publicados" y rotos, hasta que se midió contra producción.
#   2. Un mes de trabajo vivió solo en un disco, sin copia en ningún lado.
#
# Ahora: lo que está en `main` es lo que está publicado. Se merge y sale solo.
#
# Necesita UN secret en el repo (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — token con permiso "Edit Cloudflare Workers"
# (el account_id no es secreto y vive en wrangler.jsonc)

name: Publicar viven.ch

on:
  push:
    branches: [main]
  # permite publicar a mano desde la pestaña Actions sin tener que commitear
  workflow_dispatch:

# Dos deploys no se pisan: se hacen la cola.
#
# Estaba en cancel-in-progress: true, que suena bien —"que gane el último"— y falla
# feo. El 26 ago 2026 salieron siete pushes seguidos, cada uno canceló al anterior, y
# producción quedó cuatro commits atrás: dos páginas nuevas daban 404 estando en main y
# el dashboard servía la versión anterior. Nadie se entera, porque cancelado no es
# fallado y en Actions no se ve rojo.
#
# En cola es más lento y es correcto: cada push se publica, en orden, y el último en
# terminar es siempre el más nuevo. Publicar de más no rompe nada; publicar de menos sí.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` corre antes el guardia check-strays: si aparece una copia
      # " 2" o un nombre en forma NFD, el build FALLA acá y no se publica. Es a
      # propósito: esas dos cosas no rompen la compilación pero sí el sitio vivo.
      - run: npm run build

      # El account_id vive en wrangler.jsonc (identifica, no autoriza), así que
      # el único secret que hace falta es el token.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Sin fijar versión, la action trae wrangler 3.90, que NO sabe leer
          # wrangler.jsonc (soporte de JSONC recién desde la 4) y falla con
          # "Missing entry-point" — un error que apunta al main y no a la causa.
          # Fijada a la misma versión que se usa en local, para que publicar
          # desde GitHub y desde una máquina den exactamente lo mismo.
          wranglerVersion: "4.123.0"

      # Qué versión quedó con el tráfico. Sin esto no hay forma de ver desde
      # Actions que se subió una versión nueva y sigue sirviendo una vieja.
      - name: Qué versión está sirviendo
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.123.0 deployments list --name viven-astro-website | tail -30

      # Verificar, no suponer. Un deploy "exitoso" que devuelve 404 en la home
      # ya pasó; el paso falla y queda registrado en Actions en vez de descubrirse
      # tres días después en Search Console.
      - name: Comprobar que producción responde
        run: |
          sleep 20
          for u in https://www.viven.ch/en/ https://www.viven.ch/de/ https://www.viven.ch/es/ https://www.viven.ch/dashboard/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "$u")
            echo "$code  $u"
            [ "$code" = "200" ] || exit 1
          done

      # ── Y QUE SEA EL CÓDIGO QUE ACABA DE COMPILAR ──
      #
      # 28 ago 2026: doce horas de deploys en verde y producción servía un build
      # del 22. Wrangler decía "Uploaded 3 files", el paso de arriba decía 200 en
      # las cuatro URLs, y el archivo recién subido daba 404 al pedirlo por su
      # nombre. Un 200 sobre el build viejo se ve idéntico a un 200 sobre el nuevo.
      #
      # Esto compara el hash del bundle que Astro acaba de generar contra el que
      # pide el HTML servido. Es la única comprobación que distingue "publicado"
      # de "publicado hace seis días". Reintenta por la propagación del CDN.
      - name: Comprobar que lo servido ES lo que se compiló
        run: |
          esperado=$(grep -o '_astro/index\.astro_astro_type_script[^"]*\.js' dist/dashboard/index.html | head -1)
          if [ -z "$esperado" ]; then echo "no pude leer el bundle del build local"; exit 1; fi
          echo "esperado: $esperado"
          for i in 1 2 3 4 5 6; do
            servido=$(curl -s -m 25 "https://www.viven.ch/dashboard/?cb=$(date +%s%N)" | grep -o '_astro/index\.astro_astro_type_script[^"]*\.js' | head -1)
            echo "  intento $i · servido: ${servido:-(nada)}"
            [ "$servido" = "$esperado" ] && echo "✓ producción sirve el build de este commit" && exit 0
            sleep 15
          done
          echo "✗ producción sigue sirviendo otro build: '$servido' en vez de '$esperado'"
          echo "  El deploy subió los archivos pero el tráfico va a otra versión."
          echo "  Mirar el paso «Qué versión está sirviendo» de acá arriba."
          exit 1

      # Avisarle a Bing en CADA deploy, no cuando alguien se acuerda. Google se
      # entera solo (cron diario que reenvía el sitemap); Bing no tiene forma de
      # saberlo salvo que se lo digan. Y Bing pesa más de lo que su tamaño
      # sugiere: mismo período, 6× menos impresiones que Google pero casi los
      # mismos clicks — CTR 3,8% contra 0,7%.
      # Va DESPUÉS de comprobar que producción responde: avisar de páginas que
      # todavía no están arriba es peor que no avisar.
      - name: Avisarle a Bing y Yandex (IndexNow)
        continue-on-error: true   # si esto falla, el deploy ya salió bien igual
        run: node scripts/indexnow.mjs
