# Respaldo diario de la base, corriendo en GitHub — no en la Mac de Sebastián.
#
# POR QUÉ (2026-08-17): los dos proyectos de Supabase están en plan free, que no
# hace backups. Medido: 0 respaldos disponibles y PITR apagado en los dos. Un
# `delete` mal apuntado o una migración con un error se llevaba puestos los
# leads, las propuestas, las facturas y el historial de emails, sin vuelta atrás.
#
# El plan Pro lo resuelve pagando (~USD 35/mes por los dos proyectos). Esto hace
# lo mismo gratis para una base de este tamaño, con una diferencia honesta:
# restaurar es manual (psql), no un botón. El archivo es un pg_dump de verdad
# —esquema + datos— no un volcado de JSON: se puede restaurar entero.
#
# Necesita dos secrets:
#   SUPABASE_BACKUP_DBURL — usuario de SOLO LECTURA (viven_backup_ro), no la
#                           llave maestra. Si se filtrara, no puede escribir nada.
#   CLOUDFLARE_API_TOKEN  — el mismo que ya usa el deploy (necesita R2: Edit)
#
# ALCANCE: el esquema `public` (todo lo del negocio) MÁS los archivos de
# Storage (PDFs de lead magnets, avatares). Las cuentas de acceso (`auth`) no
# entran a propósito: auth.users tiene RLS y darle permiso al usuario de
# respaldo obliga a tocar un esquema que administra Supabase y que se puede
# pisar en una actualización. Son dos cuentas, quién tiene acceso ya está en
# public.user_roles (que sí se respalda), y se recrean desde la pantalla de
# Usuarios en un minuto.

name: Respaldo de la base

on:
  schedule:
    # 03:15 UTC = 05:15 en Zúrich. Fuera de hora de trabajo, y a los :15 para no
    # caer en el minuto en punto, que es cuando arranca medio GitHub a la vez.
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  respaldar:
    runs-on: ubuntu-latest
    # Si algo se cuelga, que muera acá y avise. La primera versión de este
    # workflow se quedó clavada instalando paquetes y habría seguido así horas.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pg_dump viene de la imagen oficial de Postgres, no de apt.
      #
      # POR QUÉ ASÍ: el servidor es PostgreSQL 17 y pg_dump se niega a trabajar
      # contra un servidor más nuevo que él. El runner trae el 16, y sumar el
      # repositorio oficial de Postgres para instalar el 17 falló dos veces
      # seguidas: la primera dejó /usr/bin/pg_dump apuntando igual al 16 (el
      # paquete instala en otra ruta), y la segunda se colgó indefinidamente en
      # el paso de apt. Con Docker la versión es exacta y no depende de cómo
      # venga armado el runner esta semana.
      # La única forma en que este respaldo puede salir incompleto EN SILENCIO es
      # que aparezca una tabla nueva sin el permiso de lectura del usuario de
      # backup: con las políticas activas (ver abajo) esa tabla se dumpearía con
      # cero filas y nadie se enteraría. Se comprueba antes de bajar nada.
      - name: Que ninguna tabla se quede afuera
        env:
          DBURL: ${{ secrets.SUPABASE_BACKUP_DBURL }}
        run: |
          # El SQL va en un ARCHIVO, no en la línea de comandos. Pasarlo inline
          # significa cruzar dos shells (la del runner y la del contenedor) y las
          # dos se comen algo: el primer intento perdió las comillas simples y el
          # segundo perdió las de dólar, porque la shell de adentro expandió $q
          # como variable vacía. Con un archivo no hay nada que escapar.
          # El heredoc va con 'SQL' entre comillas para que el runner tampoco
          # toque el contenido.
          cat > check.sql <<'SQL'
          select string_agg(t.tablename, ', ')
          from pg_tables t
          where t.schemaname = 'public'
            and not exists (select 1 from pg_policies p
                            where p.schemaname = 'public'
                              and p.tablename = t.tablename
                              and p.policyname = 'backup_ro_read');
          SQL
          # Si no falta ninguna, string_agg devuelve NULL y psql -tA imprime vacío.
          FALTAN=$(docker run --rm -e DBURL -v "$PWD:/w" postgres:17-alpine \
                     sh -c 'psql "$DBURL" -tAf /w/check.sql')
          if [ -n "$FALTAN" ]; then
            echo "::error::Estas tablas quedarían VACÍAS en el respaldo: $FALTAN — falta darles la política backup_ro_read"
            exit 1
          fi
          echo "todas las tablas tienen permiso de lectura ✓"

      - name: Bajar la base
        env:
          DBURL: ${{ secrets.SUPABASE_BACKUP_DBURL }}
        run: |
          # pipefail: sin esto, si pg_dump falla el resultado de la tubería es el
          # de gzip —que comprime la nada perfectamente— y el paso da VERDE con
          # un archivo de 20 bytes. Pasó en la primera corrida.
          set -o pipefail
          FECHA=$(date -u +%Y-%m-%d)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          # --no-owner / --no-privileges: el usuario de respaldo no es dueño de
          # nada, y sin esto el dump lleva instrucciones de permisos que fallan
          # al restaurar en otro proyecto.
          #
          # --enable-row-security: por defecto pg_dump apaga las políticas de
          # seguridad para asegurarse de llevarse TODO, y si el usuario no tiene
          # permiso para apagarlas se niega a seguir ("query would be affected by
          # row-level security policy"). Es una protección, no un capricho: sin
          # eso te daría un respaldo incompleto sin decírtelo. Como apagarlas
          # requiere ser superusuario —y en Supabase nadie lo es— se hace al
          # revés: se dumpea CON las políticas puestas, y al usuario de backup se
          # le dio permiso de lectura total en cada tabla (política
          # backup_ro_read). Ve todo, y el paso de arriba comprueba que siga así.
          docker run --rm -e DBURL postgres:17-alpine \
            sh -c 'pg_dump "$DBURL" --schema=public --no-owner --no-privileges --format=plain --enable-row-security' \
            | gzip -9 > "viven-$FECHA.sql.gz"

      # Un backup que nadie mira no es un backup. Si el usuario perdiera sus
      # permisos de lectura, el dump saldría con el esquema y CERO filas — poco
      # peso, pero no cero, y con toda la cara de haber funcionado. Por eso no
      # alcanza con "el archivo existe": se cuentan filas de verdad.
      - name: Comprobar que el respaldo sirve
        run: |
          PESO=$(stat -c%s "viven-$FECHA.sql.gz")
          echo "peso: $PESO bytes"
          [ "$PESO" -gt 20000 ] || { echo "::error::El respaldo pesa $PESO bytes — demasiado poco, algo salió mal"; exit 1; }
          for t in leads deals proposals offers email_log; do
            zcat "viven-$FECHA.sql.gz" | grep -q "COPY public.$t " \
              || { echo "::error::Falta la tabla $t en el respaldo"; exit 1; }
          done
          FILAS=$(zcat "viven-$FECHA.sql.gz" | awk '/^COPY public\.leads /{f=1;next} /^\\\.$/{f=0} f' | wc -l)
          echo "filas en leads: $FILAS"
          [ "$FILAS" -gt 0 ] || { echo "::error::leads vino VACÍA — el usuario perdió permiso de lectura"; exit 1; }

      # Los ARCHIVOS, no solo las tablas. Los 6 PDFs de lead magnets viven solo
      # dentro de Supabase: si se pierden, los botones de descarga del sitio
      # quedan rotos y no hay de dónde reponerlos. El script saca la lista del
      # índice real (storage.objects) y comprueba el tamaño de cada archivo
      # bajado — un archivo cortado no puede pasar por respaldo bueno.
      - name: Bajar los archivos de Storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/backup-storage.py "archivos-$FECHA"
          tar -czf "viven-archivos-$FECHA.tar.gz" "archivos-$FECHA"
          echo "peso: $(stat -c%s "viven-archivos-$FECHA.tar.gz") bytes"

      - name: Guardar los archivos en R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.123.0"
          command: r2 object put viven-backups/archivos/viven-archivos-${{ env.FECHA }}.tar.gz --file=viven-archivos-${{ env.FECHA }}.tar.gz --remote

      - name: Guardar en R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.123.0"
          command: r2 object put viven-backups/db/viven-${{ env.FECHA }}.sql.gz --file=viven-${{ env.FECHA }}.sql.gz --remote
