# ==========================================================================
#  Tres que faltaban. `verify_jwt` NO decide si hay que estar logueado —eso lo
#  chequea cada función por su cuenta con supabase.auth.getUser()— sino QUIÉN
#  contesta el preflight de CORS. Con true contesta el gateway de Supabase, que
#  permite `authorization, x-client-info, apikey` y NO `content-type`: el navegador
#  bloquea el POST y en pantalla se lee "Failed to send a request to the Edge
#  Function", que no se parece en nada a la causa.
#
#  Sin entrada acá el default es true, así que estas tres funcionaban solo mientras
#  nadie las redesplegara. El 26 ago 2026 se redesplegó bexio-invoice por otro
#  arreglo y quedó rota la creación de facturas — sin que nada lo avisara.
# ==========================================================================

