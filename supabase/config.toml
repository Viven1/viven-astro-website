[functions.ai-enrich]
verify_jwt = false

# verify_jwt = false NO significa "sin auth": la función valida el JWT del dashboard
# adentro (sb.auth.getUser). Lo que cambia es QUIÉN contesta el preflight CORS. Con
# verify_jwt = true lo contesta el gateway de Supabase, que permite authorization,
# x-client-info y apikey pero NO content-type — y el navegador manda content-type en
# el POST, así que el preflight falla y supabase-js dice "Failed to send a request to
# the Edge Function", que suena a que la función no existe cuando existe y arranca.
# Todas las funciones de IA de este proyecto están así por la misma razón.
