# Permiso de cada Edge Function. GENERADO DESDE EL ESTADO REAL del proyecto
# el 2026-08-23 — no escrito de memoria.
#
# POR QUÉ EXISTE: el workflow publicaba solo 2 de las 62 functions. Al pasarlo a
# "todas", el --no-verify-jwt que llevaba en la línea de comandos se habría
# aplicado a TODAS, y eso le sacaba la verificación de sesión a admin-users —
# la function que da de alta y baja usuarios del dashboard. Con este archivo
# cada una lleva su propio permiso y un deploy masivo no puede degradar ninguna.
#
# Las que van con verify_jwt = false las llaman terceros SIN sesión de Supabase:
# los webhooks de Resend, el cron con su propio secreto, y el sitio público con
# la clave publishable. No es un descuido, es su forma de funcionar.

